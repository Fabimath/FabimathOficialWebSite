<style>
  :root {
    /* Fabimath × Apple — same names as before, light values */
    --royal: #c2530a;
    --azure: #f5822a;
    --sky: #ffb35c;
    --tint: #fff3e8;
    --ink: #1d1d1f;
    --ink-2: #424245;
    --ink-3: #6e6e73;
    --panel: #ffffff;
    --panel-2: #fbfbfd;
    --text: #1d1d1f;
    --gold: #e8680c;
    --mint: #1f8f4e;
    --coral: #d70015;
    --line: rgba(0,0,0,.08);
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    --ease: cubic-bezier(.32,.72,0,1);
    --accent: var(--sky);
    /* topic accents are pastel: darken them when used as text on white */
    --accent-ink: color-mix(in srgb, var(--accent) 45%, #1d1d1f);
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.04);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--panel-2);
    color: var(--text); font-family: var(--sans);
    font-size: 17px; line-height: 1.47; letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 0 16px 80px; overflow-x: hidden;
  }
  .mosaic { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .mosaic i { position: absolute; display: block; border-radius: 6px; background: var(--tint) !important; opacity: .9; animation: drift 24s ease-in-out infinite; }
  @keyframes drift { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-10px);} }

  /* ---------- NAV ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 10; align-self: stretch;
    height: 52px; margin: 0 -16px 48px;
    padding: 0 max(16px, calc((100% - 948px) / 2));
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(251,251,253,.72);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--line);
  }
  .topbar a { color: var(--ink); font-size: 14px; font-weight: 600; letter-spacing: -0.01em; text-decoration: none; display: flex; align-items: center; gap: 8px; border-radius: 8px; transition: color .3s var(--ease); }
  .topbar a:last-child { color: var(--royal); font-weight: 500; }
  .topbar a img { width: 26px; height: 26px; border-radius: 7px; }
  .topbar a:hover { color: var(--royal); }

  .header { z-index: 1; text-align: center; margin-bottom: 40px; max-width: 980px; }
  .header h1 {
    font-family: var(--display); font-weight: 700;
    font-size: clamp(36px, 7vw, 56px); letter-spacing: -0.025em; line-height: 1.05;
    background: linear-gradient(100deg, var(--royal), var(--azure));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    padding-bottom: .06em;
  }
  .header .sub { font-size: 19px; line-height: 1.42; letter-spacing: -0.01em; color: var(--ink-3); margin-top: 10px; }

  .screen { z-index: 1; width: 100%; max-width: 980px; }
  #quizScreen { max-width: 820px; }
  #finalScreen { max-width: 640px; }
  .hidden { display: none !important; }

  /* ---------- TOPIC MENU ---------- */
  .topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
  .topic-card {
    background: var(--panel); color: var(--text); font-family: inherit;
    border: 1px solid rgba(0,0,0,.06); border-radius: 20px; padding: 32px 24px 26px; text-align: center;
    box-shadow: var(--shadow);
    cursor: pointer; transition: transform .3s var(--ease), box-shadow .3s var(--ease);
    display: flex; flex-direction: column; align-items: center;
  }
  .topic-card:hover { transform: translateY(-2px); box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 14px 32px rgba(0,0,0,.08); }
  .topic-card:active { transform: scale(.97); transition: transform 100ms ease-out; }
  .topic-card .tc-cat { margin-bottom: 18px; }
  .topic-card h3 { font-family: var(--display); font-size: 21px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 6px; }
  .topic-card .tc-name { font-size: 13px; letter-spacing: .01em; color: color-mix(in srgb, var(--tc-accent, var(--sky)) 45%, #1d1d1f); font-weight: 600; margin-bottom: 10px; }
  .topic-card p { font-size: 15px; line-height: 1.47; color: var(--ink-2); }
  .topic-card .tc-count { font-size: 12px; letter-spacing: .01em; color: var(--ink-3); margin-top: auto; padding-top: 14px; }
  .topic-card.soon { opacity: .5; cursor: default; }
  .topic-card.soon:hover { transform: none; box-shadow: var(--shadow); }
  .menu-hint { font-size: 13px; letter-spacing: .01em; color: var(--ink-3); text-align: center; margin-top: 28px; }

  /* ---------- CAT ---------- */
  .cat-box { position: relative; display: flex; justify-content: center; margin-bottom: 18px; }
  .cat-box.talking { animation: hop .45s var(--ease); }
  @keyframes hop { 0%,100% { transform: translateY(0);} 40% { transform: translateY(-5px);} }
  .char-img { display: block; image-rendering: pixelated; }
  .char-img.pop { animation: pop .4s var(--ease); }
  @keyframes pop { 0% { transform: scale(.94); opacity: .6; } 100% { transform: scale(1); opacity: 1; } }
  .catgrid { display: grid; }

  /* ---------- QUIZ ---------- */
  .quiz-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .quiz-top .qt-name { font-size: 14px; font-weight: 700; color: var(--accent-ink); }
  .progress-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: var(--ink-3); }
  .progress-row .score { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .pbar { height: 4px; background: rgba(0,0,0,.06); border-radius: 100px; overflow: hidden; margin-bottom: 24px; }
  .pbar > div { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--royal), var(--azure)); transition: width .45s var(--ease); }

  .card { background: var(--panel); border: 1px solid rgba(0,0,0,.06); border-radius: 20px; padding: 32px; box-shadow: var(--shadow); }
  .quiz-body { display: flex; gap: 24px; align-items: flex-start; }
  @media (max-width: 640px) {
    .card { padding: 22px 18px; }
    .quiz-body { flex-direction: column; align-items: center; gap: 8px; }
  }
  .quiz-cat { flex-shrink: 0; }
  .quiz-q { flex: 1; width: 100%; }
  .qtype { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .01em; color: #b34d00; background: var(--tint); padding: 5px 12px; border-radius: 980px; margin-bottom: 10px; }
  .qctx { font-size: 13px; letter-spacing: .01em; color: var(--ink-3); margin-bottom: 12px; }
  .qenun { font-size: 17px; color: var(--ink); line-height: 1.55; margin-bottom: 18px; }
  .qtable { margin: 0 0 18px; overflow-x: auto; }
  .qtable table { border-collapse: separate; border-spacing: 0; font-size: 14px; min-width: 240px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .qtable th, .qtable td { border-bottom: 1px solid var(--line); padding: 9px 14px; text-align: center; font-variant-numeric: tabular-nums; }
  .qtable tbody tr:last-child th, .qtable tbody tr:last-child td { border-bottom: 0; }
  .qtable thead th { background: var(--panel-2); color: var(--ink); font-weight: 600; }
  .qtable tbody th { background: var(--panel); color: var(--ink-2); font-weight: 500; text-align: left; }
  .qtable tbody td { color: var(--ink); }
  .qtable > div { color: var(--ink-3) !important; font-size: 13px !important; letter-spacing: .01em; }

  /* ---------- CHART (barras / torta) ---------- */
  .qchart { margin: 0 0 18px; }
  .bar-chart { display: flex; align-items: flex-end; gap: 14px; height: 160px; padding: 6px 4px 0; overflow-x: auto; }
  .bar-chart .bar-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; flex: 1 0 auto; min-width: 44px; height: 100%; }
  .bar-chart .bar-val { font-size: 12px; font-weight: 600; color: var(--ink); margin-bottom: 4px; font-variant-numeric: tabular-nums; }
  .bar-chart .bar-rect { width: 30px; border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, var(--accent), var(--azure)); }
  .bar-chart .bar-lbl { font-size: 12px; letter-spacing: .01em; color: var(--ink-2); margin-top: 6px; text-align: center; max-width: 64px; }
  .pie-wrap { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  .pie-circle { width: 130px; height: 130px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 1px var(--line); }
  .pie-legend { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .pie-legend .pl-row { display: flex; align-items: center; gap: 8px; color: var(--ink); }
  .pie-legend .pl-sw { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .pie-legend .pl-pct { color: var(--ink-3); margin-left: auto; padding-left: 10px; font-variant-numeric: tabular-nums; }
  .qchart-n { font-size: 13px; letter-spacing: .01em; color: var(--ink-3); margin-top: 8px; }
  .qask { font-size: 17px; font-weight: 600; color: var(--ink); margin-bottom: 14px; }

  .alts { display: flex; flex-direction: column; gap: 10px; }
  .alt-btn {
    background: var(--panel); border: 1px solid rgba(0,0,0,.12); border-radius: 14px;
    color: var(--ink); font-family: var(--sans); font-size: 17px; letter-spacing: -0.01em;
    padding: 14px 16px; min-height: 56px; cursor: pointer; text-align: left;
    display: flex; gap: 14px; align-items: center;
    transition: border-color .3s var(--ease), background-color .3s var(--ease), box-shadow .3s var(--ease), transform .3s var(--ease);
  }
  .alt-btn:hover:not(:disabled) { border-color: var(--royal); background: #fffaf5; }
  .alt-btn:active:not(:disabled) { transform: scale(.97); transition: transform 100ms ease-out; }
  .alt-btn:disabled { cursor: default; }
  .alt-btn > span:not(.key) { display: block; min-width: 0; overflow-x: auto; }
  .quiz-q { min-width: 0; }
  .alt-btn .key { flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; background: var(--tint); color: #b34d00; font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: background-color .2s var(--ease), color .2s var(--ease); }
  .alt-btn.correct, .alt-btn.wrong { border-width: 2px; padding: 13px 15px; }
  .alt-btn.correct { border-color: var(--mint); background: #eaf7ef; }
  .alt-btn.correct .key { background: var(--mint); color: #fff; }
  .alt-btn.wrong { border-color: var(--coral); background: #fdecee; }
  .alt-btn.wrong .key { background: var(--coral); color: #fff; }
  .alt-btn.correct::after, .alt-btn.wrong::after { margin-left: auto; padding-left: 8px; font-weight: 700; font-size: 18px; }
  .alt-btn.correct::after { content: "✓"; color: var(--mint); }
  .alt-btn.wrong::after { content: "✗"; color: var(--coral); }
  .alt-btn:disabled:not(.correct):not(.wrong) { opacity: .55; }

  .pauta { display: none; margin-top: 24px; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; padding: 22px 22px 20px; animation: fadein .35s var(--ease); }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .pauta .p-flag { font-family: var(--display); font-size: 19px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 12px; }
  .pauta.good { border-color: rgba(31,143,78,.35); }
  .pauta.bad { border-color: rgba(215,0,21,.3); }
  .pauta.good .p-flag { color: var(--mint); }
  .pauta.bad .p-flag { color: var(--coral); }
  .pauta .p-head { font-size: 15px; color: var(--ink-2); margin-bottom: 12px; line-height: 1.7; overflow-x: auto; }
  .pauta .p-steps { display: flex; flex-direction: column; gap: 8px; margin: 8px 0 14px; }
  .pauta .p-step { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--royal); border-radius: 10px; padding: 11px 14px; overflow-x: auto; }
  .pauta .p-conc { font-size: 15px; color: var(--ink); background: var(--tint); border-radius: 10px; padding: 12px 14px; line-height: 1.55; }
  .pauta .p-conc b { color: #b34d00; }

  .nav-row { margin-top: 24px; display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
  .btn {
    background: var(--royal); border: none; border-radius: 980px; color: #fff;
    font-family: var(--sans); font-size: 17px; font-weight: 500; letter-spacing: -0.01em;
    padding: 12px 24px; min-height: 44px; cursor: pointer;
    transition: background-color .3s var(--ease), transform .3s var(--ease);
  }
  .btn:hover { background: #a94707; }
  .btn:active { transform: scale(.97); transition: transform 100ms ease-out; }
  .btn.ghost { background: rgba(232,104,12,.1); color: #c25500; }
  .btn.ghost:hover { background: rgba(232,104,12,.16); }

  .final { text-align: center; padding: 40px 32px; }
  .final .ring { width: 140px; height: 140px; border-radius: 50%; margin: 6px auto 22px; display: flex; align-items: center; justify-content: center; background: conic-gradient(var(--royal) var(--deg,0deg), rgba(0,0,0,.06) 0deg); }
  .final .ring .inner { width: 120px; height: 120px; border-radius: 50%; background: var(--panel); display: flex; align-items: center; justify-content: center; flex-direction: column; }
  .final .ring .big { font-family: var(--display); font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; color: var(--ink); font-variant-numeric: tabular-nums; }
  .final .ring .lbl { font-size: 12px; letter-spacing: .01em; color: var(--ink-3); }
  .final h2 { font-family: var(--display); font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 12px; }
  .final p { font-size: 17px; color: var(--ink-2); max-width: 520px; margin: 0 auto 6px; }
  .final .nav-row { gap: 12px; }

  :focus-visible { outline: 3px solid rgba(232,104,12,.4); outline-offset: 2px; }
  .katex { font-size: 1.05em; }

  @media (max-width: 480px) {
    .topbar { margin-bottom: 32px; }
    .header .sub { font-size: 17px; }
    .final { padding: 32px 20px; }
    .final .nav-row .btn { flex: 1 1 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .mosaic i, .cat-box, .cat-box.talking, .char-img.pop { animation: none !important; }
    .pauta { animation-name: fade; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .topic-card, .alt-btn, .btn { transition: background-color .2s, border-color .2s, box-shadow .2s, opacity .2s !important; }
    .topic-card:hover, .topic-card:active, .alt-btn:active, .btn:active { transform: none !important; }
  }
  @media (prefers-reduced-transparency: reduce) {
    .topbar { background: #fbfbfd; -webkit-backdrop-filter: none; backdrop-filter: none; }
  }
  @media (prefers-contrast: more) {
    :root { --ink-2: #1d1d1f; --ink-3: #3a3a3c; --line: rgba(0,0,0,.4); }
    .topbar { background: #fbfbfd; -webkit-backdrop-filter: none; backdrop-filter: none; border-bottom-color: #1d1d1f; }
    .topic-card, .card, .alt-btn, .pauta { border-color: #1d1d1f; }
    .mosaic { display: none; }
  }
  .site-foot { text-align: center; color: var(--ink-3); font-size: 12px; letter-spacing: .01em; padding: 32px 20px 40px; }
  .version { font-variant-numeric: tabular-nums; }
</style>
<script src="version.js" defer></script>

<script>
/* ---------------- pixel cat sprite (scholar w/ glasses) ---------------- */
const SPRITE = [
"...KK..........KK...",
"..KBBK........KBBK..",
".KBPPBK......KBPPBK.",
".KBPPBBKKKKKKBBPPBK.",
".KBBBBBBBBBBBBBBBBK.",
"KBBBBBBBBBBBBBBBBBBK",
"KBAAAAABBBBAAAAAABK",
"KBAEGAABbBBAAEGAABK",
"KBAAAABWWWWBAAAAABK",
"KBbBBBWWPPWWBBBBbBK",
".KBBBBBWWWWBBBBBBK.",
".KBBYYYYYRYYYYYBBK.",
".KBBBBBBBBBBBBBBBBK.",
".KBbBBBBBBBBBBBBbBK.",
"..KBBKKBBBBBBKKBBK..",
"...KK..KKKKKK..KK..."
];
function palette(body, shade) {
  return { '.':null,'K':'#1a1008','B':body,'b':shade,'W':'#ffffff','w':'#ffe8d2',
           'E':'#1a1008','G':'#ffe6cf','P':'#ff9ecb','Y':'#ffd75e','A':'#2a1a0e','R':'#e8342a' };
}
function drawCat(el, cell, pal) {
  el.innerHTML = '';
  el.style.gridTemplateColumns = `repeat(20, ${cell}px)`;
  el.style.gridAutoRows = `${cell}px`;
  SPRITE.forEach(row => { for (const ch of row) {
    const d = document.createElement('div');
    d.style.width = cell+'px'; d.style.height = cell+'px';
    if (pal[ch]) d.style.background = pal[ch];
    el.appendChild(d);
  }});
}

/* Draws the topic mascot: image sprite with mood (if the topic has one) or the pixel cat. */
function drawChar(el, cell, t, mood) {
  if (t.imgs) {
    const size = cell * 22;
    el.style.gridTemplateColumns = 'none';
    el.innerHTML = `<img class="char-img pop" src="${t.imgs[mood] || t.imgs.neutro}" alt="${t.name}" width="${size}" height="${size}">`;
    const img = el.firstChild;
    img.addEventListener('animationend', () => img.classList.remove('pop'), { once: true });
  } else {
    drawCat(el, cell, palette(t.body, t.shade));
  }
}

/* ---------------- chart renderer (barras / torta) ---------------- */
const CHART_PALETTE = ['#ffb15c','#4ade80','#ffd75e','#ff6b61','#a78bfa','#f472b6','#34d399','#f0883e'];
function renderChart(chart) {
  if (chart.type === 'bar') {
    const max = Math.max(...chart.values) || 1;
    const cols = chart.labels.map((lbl, i) => {
      const v = chart.values[i];
      const hpct = Math.max(6, Math.round(v / max * 88));
      return `<div class="bar-col"><span class="bar-val">${v}</span><div class="bar-rect" style="height:${hpct}%;background:${CHART_PALETTE[i % CHART_PALETTE.length]}"></div><span class="bar-lbl">${lbl}</span></div>`;
    }).join('');
    return `<div class="bar-chart">${cols}</div><div class="qchart-n">${chart.unit || ''}</div>`;
  }
  if (chart.type === 'pie') {
    let acc = 0;
    const stops = chart.labels.map((lbl, i) => {
      const start = acc; acc += chart.pct[i];
      return `${CHART_PALETTE[i % CHART_PALETTE.length]} ${start}% ${acc}%`;
    }).join(', ');
    const legend = chart.labels.map((lbl, i) =>
      `<div class="pl-row"><span class="pl-sw" style="background:${CHART_PALETTE[i % CHART_PALETTE.length]}"></span>${lbl}<span class="pl-pct">${chart.pct[i]}%</span></div>`
    ).join('');
    return `<div class="pie-wrap"><div class="pie-circle" style="background:conic-gradient(${stops})"></div><div class="pie-legend">${legend}</div></div><div class="qchart-n">Total N = ${chart.N}</div>`;
  }
  return '';
}

/* ---------------- KaTeX ---------------- */
function renderMath(el) {
  if (window.renderMathInElement) {
    renderMathInElement(el, { delimiters:[
      {left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false}
    ], throwOnError:false });
  }
}

/* ---------------- build menu ---------------- */
const topicGrid = document.getElementById('topicGrid');

  const card = document.createElement('button');
  card.className = 'topic-card';
  card.style.setProperty('--tc-accent', t.accent);

    <h3>${t.title}</h3><div class="tc-name">${t.name}</div><p>${t.desc}</p>

/* ---------------- game state ---------------- */
const menuScreen = document.getElementById('menuScreen');
const quizScreen = document.getElementById('quizScreen');
const finalScreen = document.getElementById('finalScreen');
const altsEl = document.getElementById('alts');
const pauta = document.getElementById('pauta');
const nextBtn = document.getElementById('nextBtn');
const quizCatBox = document.getElementById('quizCatBox');

const N_QUIZ = 5;
let topic = null, round = [], idx = 0, score = 0, answered = false, order = [];

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function startTopic(i) {
  topic = TOPICS[i];
  document.documentElement.style.setProperty('--accent', topic.accent);
  drawChar(document.getElementById('quizCatGrid'), 6, topic, 'neutro');
  const pool = shuffle([...Array(topic.bank.length).keys()]).slice(0, N_QUIZ);
  round = pool.map(k => topic.bank[k]);
  idx = 0; score = 0;
  menuScreen.classList.add('hidden');
  finalScreen.classList.add('hidden');
  quizScreen.classList.remove('hidden');
  showQuestion();
}

function showQuestion() {
  const q = round[idx];
  answered = false;
  pauta.style.display = 'none'; pauta.className = 'pauta';
  nextBtn.classList.add('hidden');
  document.getElementById('qCounter').textContent = `Pregunta ${idx+1} de ${N_QUIZ}`;
  document.getElementById('scoreLabel').textContent = `${score} correctas`;
  document.getElementById('pbarFill').style.width = `${idx/N_QUIZ*100}%`;
  document.getElementById('qType').textContent = q.tipo;
  document.getElementById('qCtx').textContent = q.ctx;
  document.getElementById('qEnun').textContent = q.enun;
  const tEl = document.getElementById('qTable');
  if (q.chart) {
    tEl.innerHTML = renderChart(q.chart);
    tEl.className = 'qchart';
  } else if (q.table) {
    tEl.className = 'qtable';
    let html = '<table><thead><tr>' + q.table.head.map(h => `<th>${texSafe(h)}</th>`).join('') + '</tr></thead><tbody>';
    q.table.rows.forEach(r => {
      html += '<tr><th>' + texSafe(r[0]) + '</th>' + r.slice(1).map(c => `<td>${texSafe(c)}</td>`).join('') + '</tr>';
    });
    html += '</tbody></table>';
    if (q.table.N) html += `<div style="font-size:12px;color:#c19c7d;margin-top:6px">Total N = ${q.table.N}</div>`;
    tEl.innerHTML = html;
  } else { tEl.className = 'qtable'; tEl.innerHTML = ''; }
  document.getElementById('qAsk').textContent = q.ask;
  order = shuffle([...q.alts.keys()]);
  const letters = ['A','B','C','D'];
  altsEl.innerHTML = '';
  order.forEach((origIdx, pos) => {
    const b = document.createElement('button');
    b.className = 'alt-btn'; b.dataset.orig = origIdx;
    b.innerHTML = `<span class="key">${letters[pos]}</span><span>${texSafe(q.alts[origIdx])}</span>`;
    b.addEventListener('click', () => answer(pos));
    altsEl.appendChild(b);
  });
  renderMath(document.querySelector('.quiz-q'));
  drawChar(document.getElementById('quizCatGrid'), 6, topic, 'neutro');
  quizCatBox.classList.add('talking');
  setTimeout(() => quizCatBox.classList.remove('talking'), 500);
}

/* Un '<' dentro de una fórmula (p. ej. P(3,25<X<4,35)) el navegador lo lee como etiqueta HTML y corta el texto. */
const texSafe = t => String(t).replace(/<(?!\/?(b|i|br|sub|sup|span|small|strong|em)\b)/g, '&lt;');

function answer(pos) {
  if (answered) return;
  answered = true;
  const q = round[idx];
  const btns = [...altsEl.querySelectorAll('.alt-btn')];
  btns.forEach(b => b.disabled = true);
  const chosenOrig = parseInt(btns[pos].dataset.orig, 10);
  const correctPos = order.indexOf(q.correct);
  btns[correctPos].classList.add('correct');
  const good = chosenOrig === q.correct;
  if (good) { score++; document.getElementById('scoreLabel').textContent = `${score} correctas`; }
  else btns[pos].classList.add('wrong');
  drawChar(document.getElementById('quizCatGrid'), 6, topic, good ? 'exito' : 'tristeza');
  pauta.classList.add(good ? 'good' : 'bad');
  document.getElementById('pFlag').textContent = good ? '✓ ¡Correcto, miau!' : '✗ Incorrecto — revisa la pauta:';
  document.getElementById('pHead').innerHTML = `$${texSafe(q.pautaHead)}$`;
  const steps = document.getElementById('pSteps');
  steps.innerHTML = '';
  q.pautaSteps.forEach(s => {
    const d = document.createElement('div'); d.className = 'p-step';
    d.innerHTML = `\\(${texSafe(s)}\\)`; steps.appendChild(d);
  });
  document.getElementById('pConc').innerHTML = q.conc;
  renderMath(pauta);
  pauta.style.display = 'block';
  nextBtn.classList.remove('hidden');
  nextBtn.textContent = (idx+1 < N_QUIZ) ? 'Siguiente ▶' : 'Ver resultado ★';
  document.getElementById('pbarFill').style.width = `${(idx+1)/N_QUIZ*100}%`;
  nextBtn.focus();
}

function next() {
  idx++;
  if (idx < N_QUIZ) showQuestion();
  else showFinal();
}

function showFinal() {
  quizScreen.classList.add('hidden');
  finalScreen.classList.remove('hidden');
  drawChar(document.getElementById('finalCatGrid'), 6, topic, (score / N_QUIZ >= 0.6) ? 'exito' : 'tristeza');
  document.getElementById('finalScore').textContent = `${score}/${N_QUIZ}`;
  document.getElementById('ring').style.setProperty('--deg', `${score/N_QUIZ*360}deg`);
  const pct = score / N_QUIZ;
  let t, m;
  if (pct === 1) { t = '¡Purrfecto! ✦'; m = `Dominas ${topic.name}. ᕕ(=^･ω･^=)ᕗ`; }
  else if (pct >= 0.6) { t = '¡Muy bien, miau!'; m = 'Buen manejo. Repasa la pauta de las que fallaste y quedas listo.'; }
  else if (pct >= 0.4) { t = 'Vas por buen camino'; m = `A mitad de camino, miau. Descarga la ${topic.guide} en la sección Material del sitio y vuelve a intentarlo.`; }
  else { t = 'A practicar, michi'; m = `Este tema necesita más repaso. Estudia la ${topic.guide} en el sitio, revisa cada pauta y vuelve: yo te espero. (=^-ω-^=)`; }
  document.getElementById('finalTitle').textContent = t;
  document.getElementById('finalMsg').textContent = m;
}

document.getElementById('nextBtn').addEventListener('click', next);
document.getElementById('retryBtn').addEventListener('click', () => startTopic(TOPICS.indexOf(topic)));
document.getElementById('quitBtn').addEventListener('click', backMenu);
document.getElementById('homeBtn').addEventListener('click', backMenu);
function backMenu() {
  quizScreen.classList.add('hidden');
  finalScreen.classList.add('hidden');
  menuScreen.classList.remove('hidden');
}

document.addEventListener('keydown', e => {
  if (!quizScreen.classList.contains('hidden')) {
    const i = ['a','b','c','d'].indexOf(e.key.toLowerCase());
    const n = ['1','2','3','4'].indexOf(e.key);
    const pos = i>=0 ? i : n;
    if (!answered && pos>=0 && pos<order.length) answer(pos);
    else if (answered && e.key === 'Enter') next();
  }
});
